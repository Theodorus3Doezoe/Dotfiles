[opener]
edit = [
	{ run = 'if [ -n "$NVIM" ]; then nvim --server "$NVIM" --remote "$@"; else nvim "$@"; fi', block = true, desc = "Edit" }
]
zathura = [
    { run = 'zathura "$@"', orphan = true, desc = "Open in Zathura" }
]

[open]
prepend_rules = [
	{ mime = "text/*", use = "edit" },
    { mime = "application/pdf", use = "zathura" }
]
